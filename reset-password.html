<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Euvi Gestão — Nova senha</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0d0d0d;--surface2:#1e1e1e;--border:#2a2a2a;--accent:#e8432d;--accent2:#ff6b4a;--text:#f2f2f2;--muted:#8a8a8a}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:380px}.brand{text-align:center;margin-bottom:30px}.mark{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:26px;font-weight:800}.name{font-size:22px;font-weight:700}.sub{font-size:13px;color:var(--muted);margin-top:6px}.field{margin-bottom:16px}.label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}.input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;padding:13px 14px;outline:none}.input:focus{border-color:var(--accent)}.btn{width:100%;border:0;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;background:var(--accent);color:#fff}.btn:disabled{opacity:.6}.back{display:block;text-align:center;color:#bdbdbd;text-decoration:none;font-size:13px;margin-top:18px}.back:hover{color:#ff6b4a}.msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:16px;display:none;line-height:1.4}.msg.show{display:block}.error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5}.success{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#86efac}.hidden{display:none}.loading{text-align:center;color:var(--muted);font-size:13px;padding:14px 0}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="mark">E</div><div class="name">Euvi Gestão</div><div class="sub">Recuperação de acesso</div></div>

  <div id="loading-view" class="loading">Validando link de recuperação...</div>

  <div id="request-view" class="hidden">
    <div class="msg" id="request-msg"></div>
    <form id="request-form">
      <div class="field"><label>E-mail</label><input class="input" type="email" id="email" autocomplete="email" placeholder="seu@email.com" required></div>
      <button class="btn" id="request-btn" type="submit">Enviar link de recuperação</button>
    </form>
  </div>

  <div id="update-view" class="hidden">
    <div class="msg" id="update-msg"></div>
    <form id="update-form">
      <div class="field"><label>Nova senha</label><input class="input" type="password" id="new-password" autocomplete="new-password" minlength="6" required></div>
      <div class="field"><label>Confirmar nova senha</label><input class="input" type="password" id="confirm-password" autocomplete="new-password" minlength="6" required></div>
      <button class="btn" id="update-btn" type="submit">Salvar nova senha</button>
    </form>
  </div>

  <a class="back" href="index.html">← Voltar para o login</a>
</div>

<script src="config.js"></script>
<script>
function msg(id,text,type){const el=document.getElementById(id);el.textContent=text;el.className='msg show '+type}
function show(id){document.getElementById(id).classList.remove('hidden')}
function hide(id){document.getElementById(id).classList.add('hidden')}
function showUpdate(){hide('loading-view');hide('request-view');show('update-view')}
function showRequest(){hide('loading-view');show('request-view');hide('update-view')}

async function initRecovery(){
  // Supabase can return a PKCE "code" in the query string or an implicit-flow
  // access_token/type=recovery in the hash. Handle both so the link always opens
  // the password-change screen instead of the email-request screen.
  const params=new URLSearchParams(window.location.search);
  const code=params.get('code');
  const hash=new URLSearchParams(window.location.hash.replace(/^#/,'').replace(/^\?/,'&'));
  const type=hash.get('type');
  const accessToken=hash.get('access_token');

  if(code){
    const {error}=await supabaseClient.auth.exchangeCodeForSession(code);
    if(error){hide('loading-view');msg('request-msg','Este link de recuperação é inválido ou expirou. Solicite um novo link.','error');show('request-view');return;}
    showUpdate();
    return;
  }

  if(accessToken || type==='recovery'){
    // The Supabase client will process the recovery session from the URL.
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(session){showUpdate();return;}
  }

  // Give the auth state listener a chance to receive PASSWORD_RECOVERY.
  const timer=setTimeout(async()=>{
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(session)showUpdate();
    else showRequest();
  },1200);

  supabaseClient.auth.onAuthStateChange((event,session)=>{
    if(event==='PASSWORD_RECOVERY' && session){clearTimeout(timer);showUpdate();}
  });
}

document.getElementById('request-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=document.getElementById('email').value.trim(),btn=document.getElementById('request-btn');
  btn.disabled=true;btn.textContent='Enviando...';document.getElementById('request-msg').className='msg';
  const redirectTo=window.location.origin+'/reset-password.html';
  const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo});
  if(error){msg('request-msg','Não foi possível enviar o link: '+error.message,'error');btn.disabled=false;btn.textContent='Enviar link de recuperação';return;}
  msg('request-msg','Link enviado. Verifique seu e-mail e abra o botão de redefinição.','success');btn.textContent='Link enviado';
});

document.getElementById('update-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const p=document.getElementById('new-password').value,c=document.getElementById('confirm-password').value,btn=document.getElementById('update-btn');
  if(p!==c){msg('update-msg','As senhas não são iguais.','error');return}
  if(p.length<6){msg('update-msg','A senha precisa ter pelo menos 6 caracteres.','error');return}
  btn.disabled=true;btn.textContent='Salvando...';
  const {error}=await supabaseClient.auth.updateUser({password:p});
  if(error){msg('update-msg','Não foi possível alterar a senha: '+error.message,'error');btn.disabled=false;btn.textContent='Salvar nova senha';return}
  msg('update-msg','Senha alterada com sucesso. Redirecionando para o login...','success');
  setTimeout(async()=>{await supabaseClient.auth.signOut();location.href='index.html'},1500);
});

initRecovery();
</script>
</body>
</html>
