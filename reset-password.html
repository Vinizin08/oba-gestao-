<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Euvi Gestão — Recuperar senha</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--bg:#0d0d0d;--surface:#181818;--surface2:#1e1e1e;--border:#2a2a2a;--accent:#e8432d;--accent2:#ff6b4a;--text:#f2f2f2;--muted:#8a8a8a}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:380px}.brand{text-align:center;margin-bottom:30px}.mark{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:26px;font-weight:800}.name{font-size:22px;font-weight:700}.sub{font-size:13px;color:var(--muted);margin-top:6px}.field{margin-bottom:16px}.label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}.input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;padding:13px 14px;outline:none}.input:focus{border-color:var(--accent)}.btn{width:100%;border:0;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;background:var(--accent);color:#fff}.btn:disabled{opacity:.6}.back{display:block;text-align:center;color:#bdbdbd;text-decoration:none;font-size:13px;margin-top:18px}.back:hover{color:#ff6b4a}.msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:16px;display:none;line-height:1.4}.msg.show{display:block}.error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5}.success{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#86efac}.hidden{display:none}</style>
</head><body><div class="card"><div class="brand"><div class="mark">E</div><div class="name">Euvi Gestão</div><div class="sub">Recuperação de acesso</div></div><div id="request-view"><div class="msg" id="request-msg"></div><form id="request-form"><div class="field"><label>E-mail</label><input class="input" type="email" id="email" autocomplete="email" placeholder="seu@email.com" required></div><button class="btn" id="request-btn" type="submit">Enviar link de recuperação</button></form></div><div id="update-view" class="hidden"><div class="msg" id="update-msg"></div><form id="update-form"><div class="field"><label>Nova senha</label><input class="input" type="password" id="new-password" autocomplete="new-password" minlength="6" required></div><div class="field"><label>Confirmar nova senha</label><input class="input" type="password" id="confirm-password" autocomplete="new-password" minlength="6" required></div><button class="btn" id="update-btn" type="submit">Salvar nova senha</button></form></div><a class="back" href="index.html">← Voltar para o login</a></div>
<script src="config.js"></script><script>function msg(id,text,type){const el=document.getElementById(id);el.textContent=text;el.className='msg show '+type}function isRecovery(){return window.location.hash.includes('access_token=')||window.location.hash.includes('type=recovery')||new URLSearchParams(window.location.search).get('code')}function showUpdate(){document.getElementById('request-view').classList.add('hidden');document.getElementById('update-view').classList.remove('hidden')}document.getElementById('request-form').addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),btn=document.getElementById('request-btn');btn.disabled=true;btn.textContent='Enviando...';document.getElementById('request-msg').className='msg';const redirectTo=window.location.origin+'/reset-password.html';const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo});if(error){msg('request-msg','Não foi possível enviar o link: '+error.message,'error');btn.disabled=false;btn.textContent='Enviar link de recuperação';return}msg('request-msg','Se esse e-mail tiver acesso ao sistema, enviamos um link para redefinir a senha. Verifique também a caixa de spam.','success');btn.textContent='Link enviado'});document.getElementById('update-form').addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('new-password').value,c=document.getElementById('confirm-password').value,btn=document.getElementById('update-btn');if(p!==c){msg('update-msg','As senhas não são iguais.','error');return}if(p.length<6){msg('update-msg','A senha precisa ter pelo menos 6 caracteres.','error');return}btn.disabled=true;btn.textContent='Salvando...';const {error}=await supabaseClient.auth.updateUser({password:p});if(error){msg('update-msg','Não foi possível alterar a senha: '+error.message,'error');btn.disabled=false;btn.textContent='Salvar nova senha';return}msg('update-msg','Senha alterada com sucesso. Você já pode entrar com a nova senha.','success');setTimeout(()=>location.href='index.html',1500)});(async()=>{if(isRecovery()){const {data:{session}}=await supabaseClient.auth.getSession();if(session)showUpdate()}})();supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)showUpdate()});</script></body></html>
