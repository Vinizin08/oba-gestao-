<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Euvi Gestão — Entrar</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d0d0d"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#0d0d0d;--surface:#1e1e1e;--border:#2a2a2a;--accent:#e8432d;--accent2:#ff6b4a;--text:#f2f2f2;--muted:#8a8a8a}*{box-sizing:border-box}body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.login-card{width:100%;max-width:380px}.brand{text-align:center;margin-bottom:32px}.mark{width:56px;height:56px;margin:0 auto 12px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:26px;font-weight:800}.name{font-size:22px;font-weight:700}.sub{font-size:13px;color:var(--muted);margin-top:6px}.field{margin-bottom:15px}.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase}.field input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;padding:13px 14px;outline:0}.field input:focus{border-color:var(--accent)}button{width:100%;border:0;border-radius:10px;padding:14px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;margin-top:6px}button:disabled{opacity:.6}.link{display:block;text-align:center;color:var(--accent2);text-decoration:none;font-size:13px;margin-top:16px}.msg{display:none;padding:11px 12px;border-radius:8px;margin-bottom:15px;font-size:13px}.msg.show{display:block}.error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}</style></head><body><main class="login-card"><div class="brand"><div class="mark">E</div><div class="name">Euvi Gestão</div><div class="sub">Controle inteligente de estoque</div></div><div id="msg" class="msg"></div><form id="form"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Senha</label><input id="senha" type="password" autocomplete="current-password" required></div><button id="btn" type="submit">Entrar</button></form><a class="link" href="reset-password.html">Esqueci minha senha</a><a class="link" href="cadastro.html">Ainda não tenho acesso → Criar cadastro</a><div class="footer">O administrador define sua loja e setor.</div></main><script src="config.js"></script><script>const msg=document.getElementById('msg'),btn=document.getElementById('btn');function show(t){msg.textContent=t;msg.className='msg show error'}async function route(){const {data:{user}}=await supabaseClient.auth.getUser();if(!user)return;const {data:p,error}=await supabaseClient.from('profiles').select('role,active').eq('id',user.id).single();if(error||!p){show('Perfil ainda não configurado. Fale com o administrador.');await supabaseClient.auth.signOut();return}if(!p.active){show('Seu acesso está desativado.');await supabaseClient.auth.signOut();return}location.href=p.role==='adm'?'admin.html':'funcionario.html'}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Entrando...';msg.className='msg';const {error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('senha').value});if(error){show(error.message.includes('Invalid login credentials')?'E-mail ou senha incorretos.':'Erro ao entrar: '+error.message);btn.disabled=false;btn.textContent='Entrar';return}await route()});supabaseClient.auth.getSession().then(({data})=>{if(data.session)route()});</script></body></html>
