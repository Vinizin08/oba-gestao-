<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Euvi Gestão — Entrar</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d0d0d">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--bg:#0d0d0d;--surface2:#1e1e1e;--border:#2a2a2a;--accent:#e8432d;--accent2:#ff6b4a;--text:#f2f2f2;--muted:#8a8a8a;--font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.login-card{width:100%;max-width:380px}.brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:36px}.brand-mark{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}.brand-name{font-size:22px;font-weight:700}.brand-sub{font-size:13px;color:var(--muted)}.field{margin-bottom:16px}.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}.field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;padding:13px 14px;outline:none}.field input:focus{border-color:var(--accent)}.btn{width:100%;border:0;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}.primary{background:var(--accent);color:white}.primary:disabled{opacity:.6}.register{display:block;text-align:center;color:#ff6b4a;text-decoration:none;font-size:14px;font-weight:600;margin-top:20px}.msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:16px;display:none}.msg.show{display:block}.msg.error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5}.footer-note{text-align:center;font-size:12px;color:var(--muted);margin-top:24px}</style>
</head><body><div class="login-card"><div class="brand"><div class="brand-mark">E</div><div class="brand-name">Euvi Gestão</div><div class="brand-sub">Controle inteligente de estoque</div></div><div class="msg" id="msg"></div><form id="login-form"><div class="field"><label>E-mail</label><input type="email" id="email" autocomplete="username" required></div><div class="field"><label>Senha</label><input type="password" id="senha" autocomplete="current-password" required></div><button type="submit" class="btn primary" id="btn-entrar">Entrar</button></form><a class="register" href="cadastro.html">Ainda não tenho acesso → Criar cadastro</a><div class="footer-note">Acesso fornecido pelo administrador da sua loja</div></div>
<script src="config.js"></script><script>function showMsg(text,type){const el=document.getElementById('msg');el.textContent=text;el.className='msg show '+type}async function redirecionarPosLogin(){const {data:{user}}=await supabaseClient.auth.getUser();const {data:profile,error}=await supabaseClient.from('profiles').select('role,active').eq('id',user.id).single();if(error||!profile){showMsg('Não foi possível carregar seu perfil. Fale com o administrador.','error');await supabaseClient.auth.signOut();return}if(!profile.active){showMsg('Seu acesso foi desativado. Fale com o administrador.','error');await supabaseClient.auth.signOut();return}if(profile.role==='adm')location.href='admin.html';else location.href='selecionar-loja.html'}document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),senha=document.getElementById('senha').value,btn=document.getElementById('btn-entrar');btn.disabled=true;btn.textContent='Entrando...';document.getElementById('msg').classList.remove('show');const {error}=await supabaseClient.auth.signInWithPassword({email,password:senha});if(error){showMsg(error.message.includes('Invalid login credentials')?'E-mail ou senha incorretos.':'Erro ao entrar: '+error.message,'error');btn.disabled=false;btn.textContent='Entrar';return}btn.textContent='Carregando...';await redirecionarPosLogin()});(async()=>{const {data:{session}}=await supabaseClient.auth.getSession();if(session)await redirecionarPosLogin()})();</script></body></html>
