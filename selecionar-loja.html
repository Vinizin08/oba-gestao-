<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Euvi Gestão — Selecionar Loja</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d0d0d"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#0d0d0d;--surface:#161616;--surface2:#1e1e1e;--border:#2a2a2a;--accent:#e8432d;--text:#f2f2f2;--muted:#8a8a8a}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}.titulo{font-size:22px;font-weight:700;margin-bottom:8px;text-align:center}.subtitulo{font-size:13px;color:var(--muted);margin-bottom:36px;text-align:center}.lojas-grid{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;max-width:560px}.loja-card{width:150px;height:170px;background:var(--surface);border:2px solid var(--border);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer}.loja-card:active{border-color:var(--accent);background:var(--surface2)}.loja-icon{font-size:40px}.loja-nome{font-size:15px;font-weight:700;text-align:center;padding:0 8px}.loja-dot{width:8px;height:8px;border-radius:50%}.empty-state{text-align:center;color:var(--muted);font-size:14px;max-width:320px}.sair-link{margin-top:40px;font-size:13px;color:var(--muted);cursor:pointer;text-decoration:underline;background:none;border:none}.loading{color:var(--muted);font-size:14px}</style></head><body><div class="titulo">Quem está acessando?</div><div class="subtitulo" id="subtitulo">Selecione a loja para continuar</div><div class="lojas-grid" id="lojas-grid"><div class="loading">Carregando lojas...</div></div><button class="sair-link" onclick="logout()">Sair</button><script src="config.js"></script><script>async function init(){const session=await exigirSessao();if(!session)return;const {data:{user}}=await supabaseClient.auth.getUser();const {data:profile}=await supabaseClient.from('profiles').select('role,active,full_name').eq('id',user.id).single();if(!profile||!profile.active){await logout();return}if(profile.role==='adm'){location.href='admin.html';return}document.getElementById('subtitulo').textContent=`Olá, ${profile.full_name.split(' ')[0]} — selecione a loja`;const {data:memberships,error}=await supabaseClient.from('store_members').select('store_id,stores(id,name,slug,active)').eq('user_id',user.id);if(error){document.getElementById('lojas-grid').innerHTML='<div class="empty-state">Erro ao carregar suas lojas. Tente novamente ou fale com o administrador.</div>';return}const lojasAtivas=(memberships||[]).map(m=>m.stores).filter(s=>s&&s.active);if(!lojasAtivas.length){document.getElementById('lojas-grid').innerHTML='<div class="empty-state">Você ainda não tem nenhuma loja liberada. Fale com o administrador.</div>';return}if(lojasAtivas.length===1){irParaLoja(lojasAtivas[0].id,lojasAtivas[0].name);return}const cores={manoel:'#e8432d',brilhante:'#3b82f6'};document.getElementById('lojas-grid').innerHTML=lojasAtivas.map(loja=>`<div class="loja-card" onclick="irParaLoja('${loja.id}','${loja.name.replace(/'/g,'')}')"><div class="loja-icon">🏪</div><div class="loja-nome">${loja.name}</div><div class="loja-dot" style="background:${cores[loja.slug]||'#888'}"></div></div>`).join('')}function irParaLoja(storeId,storeName){localStorage.setItem('euvi_loja_ativa_id',storeId);localStorage.setItem('euvi_loja_ativa_nome',storeName);location.href='funcionario.html'}init();</script></body></html>
