<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Euvi Gestão — ADM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="manifest" href="manifest.json"><style>body{margin:0;background:#0d0d0d;color:#f2f2f2;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font-size:22px;font-weight:800}.muted{color:#888;font-size:13px}button{border:0;border-radius:10px;padding:10px 14px;background:#e8432d;color:#fff;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#181818;border:1px solid #2b2b2b;border-radius:14px;padding:18px}.num{font-size:30px;font-weight:800;margin-top:5px}.section{margin-top:26px}.section h2{font-size:16px}.table{overflow:auto;background:#181818;border:1px solid #2b2b2b;border-radius:14px}.row{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr;gap:10px;padding:13px 15px;border-bottom:1px solid #292929;min-width:620px;font-size:13px}.head{font-weight:800;color:#aaa}.status{display:inline-block;padding:4px 8px;border-radius:99px;background:#252525}.crit{color:#ff6b4a}.ok{color:#22c55e}.error{padding:14px;background:#301919;border:1px solid #633030;border-radius:10px;color:#ffaaaa}.loading{padding:20px;color:#888}.actions{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main class="wrap"><div class="top"><div><div class="brand">Euvi Gestão</div><div class="muted">Painel administrativo</div></div><div class="actions"><button onclick="carregar()">↻ Atualizar</button><button onclick="logout()">Sair</button></div></div><div id="msg"></div><div class="grid" id="cards"><div class="card"><div class="muted">Carregando</div><div class="num">—</div></div></div><div class="section"><h2>Estoque por loja</h2><div class="table" id="estoque"><div class="loading">Carregando estoque...</div></div></div><div class="section"><h2>Lojas</h2><div class="table" id="lojas"><div class="loading">Carregando lojas...</div></div></div></main><script src="config.js"></script><script>
async function init(){const s=await exigirSessao();if(!s)return;const {data:{user}}=await supabaseClient.auth.getUser();const {data:p,error}=await supabaseClient.from('profiles').select('role,active,full_name').eq('id',user.id).single();if(error||!p||!p.active||p.role!=='adm'){document.getElementById('msg').innerHTML='<div class="error">Acesso restrito ao administrador.</div>';return}carregar()}
async function carregar(){const [{data:stores,error:e1},{data:inv,error:e2},{data:products,error:e3},{data:profiles,error:e4}]=await Promise.all([supabaseClient.from('stores').select('id,name,slug,active').order('name'),supabaseClient.from('inventory').select('store_id,product_id,current_qty,min_qty,ideal_qty,updated_at'),supabaseClient.from('products').select('id,name,unit,active,category_id'),supabaseClient.from('profiles').select('id,full_name,role,active')]);if(e1||e2||e3||e4){document.getElementById('msg').innerHTML='<div class="error">Erro ao carregar dados. Verifique se as migrations do Supabase foram executadas.</div>';return}const crit=(inv||[]).filter(x=>Number(x.current_qty)<Number(x.min_qty)).length;document.getElementById('cards').innerHTML=`<div class="card"><div class="muted">Lojas</div><div class="num">${(stores||[]).length}</div></div><div class="card"><div class="muted">Produtos</div><div class="num">${(products||[]).filter(x=>x.active).length}</div></div><div class="card"><div class="muted">Colaboradores</div><div class="num">${(profiles||[]).filter(x=>x.role==='colaborador'&&x.active).length}</div></div><div class="card"><div class="muted">Estoque crítico</div><div class="num ${crit?'crit':'ok'}">${crit}</div></div>`;const pm=new Map((products||[]).map(p=>[p.id,p]));const sm=new Map((stores||[]).map(s=>[s.id,s]));document.getElementById('estoque').innerHTML='<div class="row head"><div>Produto</div><div>Loja</div><div>Atual / Ideal</div><div>Status</div></div>'+(inv||[]).map(x=>{const p=pm.get(x.product_id),s=sm.get(x.store_id),c=Number(x.current_qty)<Number(x.min_qty);return `<div class="row"><div>${p?.name||'Produto'}</div><div>${s?.name||'Loja'}</div><div>${x.current_qty} / ${x.ideal_qty} ${p?.unit||''}</div><div class="${c?'crit':'ok'}">${c?'CRÍTICO':'OK'}</div></div>`}).join('')||'<div class="loading">Sem dados.</div>';document.getElementById('lojas').innerHTML='<div class="row head"><div>Loja</div><div>Slug</div><div>Status</div><div>ID</div></div>'+(stores||[]).map(s=>`<div class="row"><div>${s.name}</div><div>${s.slug}</div><div>${s.active?'Ativa':'Inativa'}</div><div>${s.id}</div></div>`).join('')}
async function logout(){await supabaseClient.auth.signOut();location.href='index.html'}init();
</script></body></html>
