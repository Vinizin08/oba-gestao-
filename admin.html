<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0d0d0d"><title>Euvi Gestão — ADM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#0d0d0d;color:#f2f2f2;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font-size:22px;font-weight:800}.muted{color:#888;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}button,select{border:1px solid #333;border-radius:9px;padding:9px 12px;background:#222;color:#fff;font-weight:700}button.primary{background:#e8432d;border-color:#e8432d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card,.section{background:#181818;border:1px solid #2b2b2b;border-radius:14px}.card{padding:18px}.num{font-size:30px;font-weight:800;margin-top:5px}.section{margin-top:22px;overflow:hidden}.section h2{font-size:16px;margin:0;padding:16px;border-bottom:1px solid #2b2b2b}.table{overflow:auto}.row{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr;gap:10px;padding:13px 15px;border-bottom:1px solid #292929;min-width:650px;font-size:13px;align-items:center}.head{font-weight:800;color:#aaa;background:#151515}.crit{color:#ff6b4a}.ok{color:#22c55e}.error{padding:14px;background:#301919;border:1px solid #633030;border-radius:10px;color:#ffaaaa;margin-bottom:15px}.loading{padding:20px;color:#888}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#252525}.danger{color:#ff6b4a}@media(max-width:600px){.wrap{padding:14px}.top{align-items:flex-start}.brand{font-size:19px}.row{grid-template-columns:1.7fr 1.2fr 1fr 1.2fr;min-width:600px}}</style></head><body><main class="wrap"><div class="top"><div><div class="brand">Euvi Gestão</div><div class="muted" id="welcome">Painel administrativo</div></div><div class="actions"><button onclick="carregar()">↻ Atualizar</button><button onclick="logout()">Sair</button></div></div><div id="msg"></div><div class="grid" id="cards"><div class="card"><div class="muted">Carregando</div><div class="num">—</div></div></div><div class="section"><h2>🏪 Lojas</h2><div class="table" id="lojas"><div class="loading">Carregando...</div></div></div><div class="section"><h2>👥 Colaboradores — liberar acesso por loja</h2><div class="muted" style="padding:12px 15px">O colaborador primeiro cria a conta em “Criar cadastro”. Depois você escolhe a loja dele aqui.</div><div class="table" id="colaboradores"><div class="loading">Carregando...</div></div></div><div class="section"><h2>📦 Estoque por loja</h2><div class="table" id="estoque"><div class="loading">Carregando...</div></div></div></main><script src="config.js"></script><script>let stores=[],profiles=[],members=[],inv=[],products=[];async function init(){const s=await exigirSessao();if(!s)return;const {data:{user}}=await supabaseClient.auth.getUser();const {data:p,error}=await supabaseClient.from('profiles').select('role,active,full_name').eq('id',user.id).single();if(error||!p||!p.active||p.role!=='adm'){document.getElementById('msg').innerHTML='<div class="error">Acesso restrito ao administrador.</div>';return}document.getElementById('welcome').textContent='Olá, '+p.full_name+' • Painel administrativo';carregar()}async function carregar(){const [a,b,c,d,e]=await Promise.all([supabaseClient.from('stores').select('id,name,slug,active').order('name'),supabaseClient.from('profiles').select('id,full_name,role,active').order('full_name'),supabaseClient.from('store_members').select('id,store_id,user_id'),supabaseClient.from('inventory').select('store_id,product_id,current_qty,min_qty,ideal_qty'),supabaseClient.from('products').select('id,name,unit,active')]);if(a.error||b.error||c.error||d.error||e.error){document.getElementById('msg').innerHTML='<div class="error">Erro ao carregar. Verifique o banco/RLS.</div>';return}stores=a.data||[];profiles=b.data||[];members=c.data||[];inv=d.data||[];products=e.data||[];render()}function render(){const activeProducts=products.filter(p=>p.active);const critical=inv.filter(x=>Number(x.current_qty)<Number(x.min_qty)).length;document.getElementById('cards').innerHTML='<div class="card"><div class="muted">Lojas ativas</div><div class="num">'+stores.filter(s=>s.active).length+'</div></div><div class="card"><div class="muted">Produtos</div><div class="num">'+activeProducts.length+'</div></div><div class="card"><div class="muted">Colaboradores</div><div class="num">'+profiles.filter(p=>p.role==='colaborador'&&p.active).length+'</div></div><div class="card"><div class="muted">Itens críticos</div><div class="num '+(critical?'crit':'ok')+'">'+critical+'</div></div>';document.getElementById('lojas').innerHTML='<div class="row head"><div>Loja</div><div>Slug</div><div>Status</div><div>Acesso</div></div>'+stores.map(s=>'<div class="row"><div>'+s.name+'</div><div>'+s.slug+'</div><div class="'+(s.active?'ok':'danger')+'">'+(s.active?'Ativa':'Inativa')+'</div><div>'+members.filter(m=>m.store_id===s.id).length+' usuário(s)</div></div>').join('');const cols=profiles.filter(p=>p.role==='colaborador'&&p.active);document.getElementById('colaboradores').innerHTML='<div class="row head"><div>Colaborador</div><div>Loja atual</div><div>Status</div><div>Alterar acesso</div></div>'+cols.map(p=>{const ms=members.filter(m=>m.user_id===p.id);const names=ms.map(m=>stores.find(s=>s.id===m.store_id)?.name).filter(Boolean).join(', ')||'Sem loja';return '<div class="row"><div>'+p.full_name+'</div><div>'+names+'</div><div class="ok">Ativo</div><div><select onchange="alterarLoja(\''+p.id+'\',this.value)"><option value="">Selecionar loja</option>'+stores.filter(s=>s.active).map(s=>'<option value="'+s.id+'">'+s.name+'</option>').join('')+'</select></div></div>'}).join('')||'<div class="loading">Nenhum colaborador cadastrado ainda.</div>';const pm=new Map(products.map(p=>[p.id,p]));const sm=new Map(stores.map(s=>[s.id,s]));document.getElementById('estoque').innerHTML='<div class="row head"><div>Produto</div><div>Loja</div><div>Atual / Mín.</div><div>Status</div></div>'+inv.map(x=>{const p=pm.get(x.product_id),s=sm.get(x.store_id),c=Number(x.current_qty)<Number(x.min_qty);return '<div class="row"><div>'+((p&&p.name)||'Produto')+'</div><div>'+((s&&s.name)||'Loja')+'</div><div>'+x.current_qty+' / '+x.min_qty+' '+((p&&p.unit)||'')+'</div><div class="'+(c?'crit':'ok')+'">'+(c?'CRÍTICO':'OK')+'</div></div>'}).join('')}async function alterarLoja(userId,storeId){if(!storeId)return;const existing=members.filter(m=>m.user_id===userId);for(const m of existing){await supabaseClient.from('store_members').delete().eq('id',m.id)}const {error}=await supabaseClient.from('store_members').insert({store_id:storeId,user_id:userId});if(error){alert('Não foi possível liberar a loja.');return}alert('Loja liberada com sucesso.');carregar()}async function logout(){await supabaseClient.auth.signOut();location.href='index.html'}init();</script></body></html>
