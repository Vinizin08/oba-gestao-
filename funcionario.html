<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0d0d0d"><title>Euvi Gestão — Lista</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#0d0d0d;--s:#181818;--s2:#222;--b:#303030;--a:#e8432d;--g:#22c55e;--gold:#f5a623;--blue:#3b82f6;--t:#f2f2f2;--m:#888}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.header{position:sticky;top:0;z-index:20;background:rgba(13,13,13,.97);border-bottom:1px solid var(--b);padding:15px 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:800;font-size:18px}.sub{font-size:11px;color:var(--m);margin-top:3px}.actions{display:flex;gap:7px}button{border:1px solid var(--b);background:var(--s2);color:var(--t);border-radius:9px;padding:9px 11px;font-weight:700}button.primary{background:var(--a);border-color:var(--a)}button.green{background:var(--g);border-color:var(--g);color:white}.meta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.tag{padding:6px 10px;border-radius:99px;background:var(--s2);font-size:12px;color:var(--m)}.tag.area{color:white}.search{padding:12px 16px}.search input{width:100%;background:var(--s2);border:1px solid var(--b);border-radius:10px;color:var(--t);padding:12px;font-size:15px;outline:0}.cats{display:flex;gap:7px;overflow:auto;padding:0 16px 10px}.chip{white-space:nowrap;padding:7px 12px;border-radius:20px;border:1px solid var(--b);background:var(--s2);color:var(--m);font-size:12px;font-weight:700}.chip.on{background:var(--a);color:#fff;border-color:var(--a)}.list{padding:0 16px 100px;max-width:760px;margin:auto}.section{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:1.3px;padding:12px 0 7px}.card{background:var(--s);border:1px solid var(--b);border-radius:14px;margin-bottom:10px;overflow:hidden}.card.critical{border-color:rgba(232,67,45,.55)}.bar{height:3px;background:var(--b)}.bar i{display:block;height:100%}.main{padding:13px 14px 8px;display:flex;gap:10px}.icon{width:38px;height:38px;border-radius:10px;background:var(--s2);display:grid;place-items:center;flex:none}.info{flex:1}.name{font-weight:700}.meta2{font-size:11px;color:var(--m);margin-top:4px}.qty{font-size:20px;font-weight:800}.controls{display:flex;gap:8px;padding:0 14px 14px}.controls button{width:48px;height:44px;font-size:22px}.controls input{flex:1;min-width:0;background:var(--s2);border:2px solid var(--b);border-radius:11px;color:var(--t);font-size:20px;font-weight:800;text-align:center;outline:0}.savebar{position:fixed;bottom:0;left:0;right:0;background:rgba(13,13,13,.97);border-top:1px solid var(--b);padding:10px 16px;z-index:30}.savebar button{width:100%;padding:13px;font-size:14px}.toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:var(--s);border:1px solid var(--g);color:var(--g);padding:11px 15px;border-radius:10px;z-index:50;display:none}.toast.on{display:block}.empty{padding:45px 20px;text-align:center;color:var(--m)}.waiting{max-width:500px;margin:80px auto;padding:25px 18px;text-align:center;background:var(--s);border:1px solid var(--b);border-radius:14px}@media(min-width:700px){.header{padding-left:max(16px,calc((100% - 760px)/2));padding-right:max(16px,calc((100% - 760px)/2))}}</style></head><body><header class="header"><div class="top"><div><div class="brand">🍔 Euvi Gestão</div><div class="sub" id="user">Carregando...</div></div><div class="actions"><button onclick="load()">↻</button><button onclick="logout()">Sair</button></div></div><div class="meta"><span class="tag" id="storeTag">Loja: —</span><span class="tag area" id="areaTag">Setor: —</span></div></header><div class="search"><input id="search" placeholder="🔍 Buscar produto..." oninput="render()"></div><div class="cats" id="cats"></div><main class="list" id="list"><div class="empty">Carregando lista...</div></main><div class="savebar"><button class="green" onclick="sendList()">📤 Enviar lista ao ADM <span id="changed">0</span></button></div><div class="toast" id="toast"></div><script src="config.js"></script><script>let user=null,profile=null,store=null,rows=[],changed=new Map(),category='todos';const icons={Carnes:'🥩',Frios:'🧀',Verduras:'🥬',Mercado:'🛒',Embalagem:'📦',Bebidas:'🥤',Outros:'📌'};async function init(){const s=await exigirSessao();if(!s)return;const u=await supabaseClient.auth.getUser();user=u.data.user;const {data:p,error}=await supabaseClient.from('profiles').select('full_name,role,active,sector').eq('id',user.id).single();if(error||!p||!p.active){await logout();return}if(p.role==='adm'){location.href='admin.html';return}profile=p;document.getElementById('user').textContent=p.full_name+' • Lista de estoque';document.getElementById('areaTag').textContent='Setor: '+(p.sector==='frente'?'Frente':'Cozinha');await load()}async function load(){const {data:m,error:me}=await supabaseClient.from('store_members').select('store_id,stores(id,name,slug,active)').eq('user_id',user.id);if(me||!m?.length){document.getElementById('list').innerHTML='<div class="waiting"><h2>Acesso aguardando liberação</h2><p style="color:var(--m)">Seu cadastro existe, mas o administrador ainda não definiu sua loja e setor.</p><button onclick="logout()">Sair</button></div>';return}store=m[0].stores;if(!store?.active){document.getElementById('list').innerHTML='<div class="waiting">Loja inativa.</div>';return}document.getElementById('storeTag').textContent='Loja: '+store.name;const {data,error}=await supabaseClient.from('inventory').select('id,store_id,product_id,current_qty,min_qty,ideal_qty,updated_at,products(id,name,unit,area,active,categories(name,icon))').eq('store_id',store.id);if(error){document.getElementById('list').innerHTML='<div class="waiting">Não foi possível carregar o estoque.</div>';return}rows=(data||[]).filter(r=>r.products?.active);changed.clear();render()}function render(){const q=(document.getElementById('search').value||'').toLowerCase();const available=[...new Set(rows.map(r=>r.products?.categories?.name).filter(Boolean))];document.getElementById('cats').innerHTML='<button class="chip '+(category==='todos'?'on':'')+'" onclick="setCat(\'todos\')">Todos</button>'+available.map(c=>`<button class="chip ${category===c?'on':''}" onclick="setCat(${JSON.stringify(c)})">${icons[c]||'📌'} ${c}</button>`).join('');const filtered=rows.filter(r=>(category==='todos'||r.products.categories?.name===category)&&(!q||r.products.name.toLowerCase().includes(q)));let last='';document.getElementById('list').innerHTML=filtered.map(r=>{const cat=r.products.categories?.name||'Outros',v=changed.has(r.id)?changed.get(r.id):Number(r.current_qty),min=Number(r.min_qty),ideal=Number(r.ideal_qty),critical=v<min,pct=Math.min(100,Math.round(v/Math.max(ideal,1)*100));let sec='';if(cat!==last){sec='<div class="section">'+(icons[cat]||'📌')+' '+cat+'</div>';last=cat}return sec+`<div class="card ${critical?'critical':''}"><div class="bar"><i style="width:${pct}%;background:${critical?'var(--a)':'var(--g)'}"></i></div><div class="main"><div class="icon">${icons[cat]||'📌'}</div><div class="info"><div class="name">${r.products.name}</div><div class="meta2">Mínimo ${min} ${r.products.unit} · Ideal ${ideal} ${r.products.unit}${critical?' · ⚠️ Pedir '+Math.max(0,ideal-v)+' '+r.products.unit:''}</div></div><div class="qty">${v}<small style="font-size:10px;color:#888"> ${r.products.unit}</small></div></div><div class="controls"><button onclick="adjust('${r.id}',-1)">−</button><input type="number" min="0" step="0.5" value="${v}" onchange="setQty('${r.id}',this.value)"><button onclick="adjust('${r.id}',1)">+</button></div></div>`}).join('')||'<div class="empty">Nenhum produto para este setor.</div>';document.getElementById('changed').textContent=changed.size?'('+changed.size+')':''}function setCat(c){category=c;render()}function setQty(id,v){const r=rows.find(x=>x.id===id);if(!r)return;const n=Math.max(0,Number(v)||0);if(n===Number(r.current_qty))changed.delete(id);else changed.set(id,n);render()}function adjust(id,d){const r=rows.find(x=>x.id===id),v=changed.has(id)?changed.get(id):Number(r.current_qty);setQty(id,v+d)}async function save(){for(const [id,v] of changed){const r=rows.find(x=>x.id===id);const {error}=await supabaseClient.from('inventory').update({current_qty:v,updated_by:user.id,updated_at:new Date().toISOString()}).eq('id',id).eq('store_id',store.id);if(error){toast('Erro ao salvar');return false}await registrarAuditoria({storeId:store.id,productId:r.product_id,action:'inventory_update',oldValue:r.current_qty,newValue:v});r.current_qty=v}changed.clear();return true}async function sendList(){if(!rows.length){toast('Nenhum produto disponível');return}if(changed.size){const ok=await save();if(!ok)return}const need=rows.filter(r=>Number(r.current_qty)<Number(r.min_qty));if(!need.length){toast('Nenhum item abaixo do mínimo');return}const {data:list,error}=await supabaseClient.from('inventory_lists').insert({store_id:store.id,status:'enviada',created_by:user.id,sent_at:new Date().toISOString()}).select('id').single();if(error){toast('Erro ao criar lista');return}const items=need.map(r=>({list_id:list.id,product_id:r.product_id,qty_to_order:Math.max(0,Number(r.ideal_qty)-Number(r.current_qty)),qty_to_order_kg:r.products.unit==='kg'?Math.max(0,Number(r.ideal_qty)-Number(r.current_qty)):null}));const {error:ie}=await supabaseClient.from('inventory_list_items').insert(items);if(ie){toast('Lista criada, mas itens não foram enviados');return}toast('Lista enviada ao ADM');setTimeout(load,600)}function toast(t){const e=document.getElementById('toast');e.textContent='✓ '+t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2300)}async function logout(){await supabaseClient.auth.signOut();location.href='index.html'}init();</script></body></html>
