<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0d0d0d"><title>Euvi Gestão — Estoque</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#0d0d0d;--surface:#181818;--surface2:#222;--border:#303030;--accent:#e8432d;--accent2:#ff6b4a;--green:#22c55e;--blue:#3b82f6;--text:#f2f2f2;--muted:#888}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.header{position:sticky;top:0;z-index:10;background:rgba(13,13,13,.96);backdrop-filter:blur(10px);padding:16px 16px 12px;border-bottom:1px solid var(--border)}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:18px}.sub{font-size:11px;color:var(--muted);margin-top:2px}.actions{display:flex;gap:7px}button{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:9px;padding:9px 11px;font-weight:700}button.primary{background:var(--accent);border-color:var(--accent)}button.green{background:var(--green);border-color:var(--green)}.store{margin-top:12px;display:flex;gap:8px}.store button{flex:1}.store button.active{border-color:var(--accent);color:var(--accent2)}.search{padding:10px 16px}.search input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px 14px;font-size:15px;outline:0}.cats{display:flex;gap:7px;overflow:auto;padding:0 16px 10px}.chip{white-space:nowrap;padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:12px;font-weight:700}.chip.active{background:var(--accent);border-color:var(--accent);color:white}.list{padding:0 16px 100px}.section{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:1.4px;padding:14px 0 8px}.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}.card.critical{border-color:rgba(232,67,45,.5)}.bar{height:3px;background:var(--border)}.bar i{display:block;height:100%}.main{padding:13px 14px 8px;display:flex;gap:11px}.icon{width:38px;height:38px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-size:18px;flex:none}.info{flex:1}.name{font-weight:700;font-size:14px}.meta{font-size:11px;color:var(--muted);margin-top:4px}.qty{font-size:20px;font-weight:800;text-align:right}.controls{display:flex;gap:8px;padding:0 14px 14px}.controls button{width:48px;height:46px;font-size:22px}.controls input{flex:1;min-width:0;background:var(--surface2);border:2px solid var(--border);border-radius:11px;color:var(--text);font-size:20px;font-weight:800;text-align:center;outline:0}.savebar{position:fixed;bottom:0;left:0;right:0;background:rgba(13,13,13,.96);padding:12px 16px;border-top:1px solid var(--border);z-index:20}.savebar button{width:100%;font-size:15px;padding:14px}.msg{text-align:center;color:var(--muted);padding:50px 20px}.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--green);color:var(--green);padding:11px 16px;border-radius:10px;font-size:13px;font-weight:700;z-index:50;display:none}.toast.show{display:block}@media(min-width:700px){.list{max-width:760px;margin:auto}.header{padding-left:max(16px,calc((100% - 760px)/2));padding-right:max(16px,calc((100% - 760px)/2))}.search,.cats{max-width:760px;margin:auto}}</style></head><body><header class="header"><div class="top"><div><div class="brand">🍔 Euvi Gestão</div><div class="sub" id="user-label">Carregando...</div></div><div class="actions"><button onclick="voltarLojas()">🏪</button><button onclick="logout()">Sair</button></div></div><div class="store"><button id="store-manoel" onclick="selecionarLoja('manoel')">🔴 Manoel</button><button id="store-brilhante" onclick="selecionarLoja('brilhante')">🔵 Brilhante</button></div></header><div class="search"><input id="search" placeholder="🔍 Buscar produto..." oninput="render()"></div><div class="cats" id="cats"></div><main class="list" id="list"><div class="msg">Carregando estoque...</div></main><div class="savebar"><button class="green" onclick="salvarAlteracoes()">✅ Salvar contagem <span id="changed-count">0</span></button></div><div class="toast" id="toast"></div><script src="config.js"></script><script>let store=null,rows=[],changed=new Map(),category='todos',user=null;const icons={Carnes:'🥩',Frios:'🧀',Verduras:'🥬',Mercado:'🛒',Embalagem:'📦',Bebidas:'🥤',Outros:'📌'};async function init(){const s=await exigirSessao();if(!s)return;const r=await supabaseClient.auth.getUser();user=r.data.user;const {data:p}=await supabaseClient.from('profiles').select('full_name,role,active').eq('id',user.id).single();if(!p||!p.active){await logout();return}if(p.role==='adm'){location.href='admin.html';return}document.getElementById('user-label').textContent=p.full_name+' • Estoque';const id=localStorage.getItem('euvi_loja_ativa_id');if(!id){location.href='selecionar-loja.html';return}const {data:m}=await supabaseClient.from('store_members').select('store_id,stores(id,name,slug,active)').eq('user_id',user.id);const stores=(m||[]).map(x=>x.stores).filter(Boolean);if(!stores.some(x=>x.id===id)){location.href='selecionar-loja.html';return}store=stores.find(x=>x.id===id);document.getElementById('store-manoel').classList.toggle('active',store.slug==='manoel');document.getElementById('store-brilhante').classList.toggle('active',store.slug==='brilhante');await carregar();}async function carregar(){const {data,error}=await supabaseClient.from('inventory').select('id,store_id,product_id,current_qty,min_qty,ideal_qty,updated_at,products(id,name,unit,active,categories(name,icon))').eq('store_id',store.id);if(error){document.getElementById('list').innerHTML='<div class="msg">Erro ao carregar estoque.<br>Tente atualizar.</div>';return}rows=(data||[]).filter(x=>x.products&&x.products.active);changed.clear();render();}function render(){const q=document.getElementById('search').value.toLowerCase();const filtered=rows.filter(r=>(category==='todos'||r.products.categories?.name===category)&&(!q||r.products.name.toLowerCase().includes(q)));const cats=[...new Set(rows.map(r=>r.products.categories?.name).filter(Boolean))];document.getElementById('cats').innerHTML='<button class="chip '+(category==='todos'?'active':'')+'" onclick="setCat(\'todos\')">Todos</button>'+cats.map(c=>'<button class="chip '+(category===c?'active':'')+'" onclick="setCat('+JSON.stringify(c)+')">'+(icons[c]||'📌')+' '+c+'</button>').join('');if(!filtered.length){document.getElementById('list').innerHTML='<div class="msg">Nenhum produto encontrado.</div>';return}let last='';document.getElementById('list').innerHTML=filtered.map(r=>{const cat=r.products.categories?.name||'Outros';let h='';if(cat!==last){h='<div class="section">'+(icons[cat]||'📌')+' '+cat+'</div>';last=cat}const v=changed.has(r.id)?changed.get(r.id):Number(r.current_qty);const min=Number(r.min_qty),ideal=Number(r.ideal_qty);const critical=v<min,pct=Math.min(100,Math.round((v/Math.max(ideal,1))*100));return h+'<div class="card '+(critical?'critical':'')+'"><div class="bar"><i style="width:'+pct+'%;background:'+(critical?'var(--accent)':'var(--green)')+'"></i></div><div class="main"><div class="icon">'+(icons[cat]||'📌')+'</div><div class="info"><div class="name">'+r.products.name+'</div><div class="meta">Mínimo: '+min+' '+r.products.unit+' • Ideal: '+ideal+' '+r.products.unit+'</div></div><div class="qty">'+v+'<small style="font-size:10px;color:#888"> '+r.products.unit+'</small></div></div><div class="controls"><button onclick="ajustar(\''+r.id+'\',-1)">−</button><input type="number" min="0" step="0.5" value="'+v+'" onchange="setQty(\''+r.id+'\',this.value)"><button onclick="ajustar(\''+r.id+'\',1)">+</button></div></div>'}).join('');document.getElementById('changed-count').textContent=changed.size?('('+changed.size+')'):'';}function setCat(c){category=c;render()}function setQty(id,v){const r=rows.find(x=>x.id===id);if(!r)return;const n=Math.max(0,Number(v)||0);if(n===Number(r.current_qty))changed.delete(id);else changed.set(id,n);render()}function ajustar(id,d){const r=rows.find(x=>x.id===id);const v=changed.has(id)?changed.get(id):Number(r.current_qty);setQty(id,v+d)}async function salvarAlteracoes(){if(!changed.size){toast('Nenhuma alteração para salvar');return}const entries=[...changed.entries()];for(const [id,v] of entries){const r=rows.find(x=>x.id===id);const {error}=await supabaseClient.from('inventory').update({current_qty:v,updated_by:user.id,updated_at:new Date().toISOString()}).eq('id',id).eq('store_id',store.id);if(error){toast('Erro ao salvar '+r.products.name);return}await registrarAuditoria({storeId:store.id,productId:r.product_id,action:'inventory_update',oldValue:r.current_qty,newValue:v});r.current_qty=v}changed.clear();render();toast('Estoque salvo e sincronizado');}function selecionarLoja(slug){const id=localStorage.getItem('euvi_loja_ativa_id');if(store?.slug===slug)return;supabaseClient.from('stores').select('id,name,slug').eq('slug',slug).single().then(({data})=>{if(data){localStorage.setItem('euvi_loja_ativa_id',data.id);localStorage.setItem('euvi_loja_ativa_nome',data.name);location.reload()}})}function voltarLojas(){location.href='selecionar-loja.html'}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}init();</script></body></html>
