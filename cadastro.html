<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Euvi Gestão — Cadastro</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#0d0d0d;--surface:#1e1e1e;--border:#2a2a2a;--accent:#e8432d;--text:#f2f2f2;--muted:#8a8a8a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:380px}.brand{text-align:center;margin-bottom:28px}.mark{width:56px;height:56px;margin:0 auto 12px;border-radius:16px;background:linear-gradient(135deg,#e8432d,#ff6b4a);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}.title{font-size:22px;font-weight:700}.sub{font-size:13px;color:var(--muted);margin-top:7px}.field{margin-bottom:15px}label{display:block;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;margin-bottom:6px}input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:15px;outline:0}input:focus{border-color:var(--accent)}button{width:100%;border:0;border-radius:10px;padding:14px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;margin-top:6px}button:disabled{opacity:.6}.back{display:block;text-align:center;color:#ff6b4a;text-decoration:none;font-size:14px;margin-top:18px}.msg{display:none;padding:12px;border-radius:9px;margin-bottom:15px;font-size:13px}.msg.show{display:block}.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#86efac}.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5}</style></head><body><main class="card"><div class="brand"><div class="mark">E</div><div class="title">Criar cadastro</div><div class="sub">Solicite seu acesso ao Euvi Gestão</div></div><div id="msg" class="msg"></div><form id="form"><div class="field"><label>Nome completo</label><input id="nome" type="text" autocomplete="name" required minlength="2"></div><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Senha</label><input id="senha" type="password" autocomplete="new-password" minlength="6" required></div><div class="field"><label>Confirmar senha</label><input id="confirmar" type="password" autocomplete="new-password" minlength="6" required></div><button id="btn" type="submit">Criar cadastro</button></form><a class="back" href="index.html">← Voltar para entrar</a></main><script src="config.js"></script><script>const form=document.getElementById('form'),btn=document.getElementById('btn'),msg=document.getElementById('msg');function show(t,c){msg.textContent=t;msg.className='msg show '+c}form.addEventListener('submit',async e=>{e.preventDefault();const nome=document.getElementById('nome').value.trim(),email=document.getElementById('email').value.trim(),senha=document.getElementById('senha').value,confirmar=document.getElementById('confirmar').value;if(senha!==confirmar){show('As senhas não coincidem.','err');return}btn.disabled=true;btn.textContent='Criando...';const {data,error}=await supabaseClient.auth.signUp({email,password:senha,options:{data:{full_name:nome}}});if(error){show(error.message.includes('already registered')?'Este e-mail já possui cadastro.':'Não foi possível criar o cadastro: '+error.message,'err');btn.disabled=false;btn.textContent='Criar cadastro';return}if(data.session){show('Cadastro criado. Seu perfil foi registrado como colaborador. Aguarde a liberação/associação à loja pelo administrador.','ok');setTimeout(()=>location.href='index.html',1800)}else{show('Cadastro criado. Verifique seu e-mail para confirmar a conta. Depois, entre no Euvi Gestão.','ok');form.reset();btn.disabled=false;btn.textContent='Criar cadastro'}});</script></body></html>
